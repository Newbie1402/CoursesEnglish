<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #fff;
            max-width: 600px;
            margin: auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 20px;
        }
        .content {
            padding: 20px;
        }
        .footer {
            background-color: #f1f1f1;
            color: #666;
            font-size: 12px;
            padding: 10px 20px;
            text-align: center;
        }
        a {
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        E-Course - Thông báo
    </div>
    <div class="content">
        <h2>Xin chào!</h2>
        <p>Email <a th:href="'mailto:' + ${email}" th:text="${email}">example@example.com</a> của bạn đã được thêm vào hệ thống</p>
        <p>Đăng nhập ngay để tham gia E-course</p>
        <p>Chúc bạn có trải nghiệm học tập tuyệt vời cùng E-Course 🎉</p>
    </div>
    <div class="footer">
        © 2025 E-Course.
    </div>
</div>
</body>
</html>
