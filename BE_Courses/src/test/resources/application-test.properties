spring.application.name=Courses-Test

# H2 in-memory database cho test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate config
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.docker.compose.enabled=false

logging.level.root=INFO
logging.level.org.springframework=DEBUG
logging.level.com.Courses=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
logging.file.name=logs/test-debug.log

jwt.secret=test-secret-key
admin.user.username=testadmin
admin.user.email=testadmin@example.com
admin.user.password=testpassword

spring.security.oauth2.client.registration.google.client-id=dummy
spring.security.oauth2.client.registration.google.client-secret=dummy
RECAPTCHA_API_SECRET_KEY=dummy
recaptcha.secret=dummy
google.recaptcha.secret=dummy
spring.mail.username=dummy
spring.mail.password=dummy
aws.access-key=dummy
aws.secret-key=dummy
cloudinary.cloud_name=dummy
cloudinary.api_key=dummy
cloudinary.api_secret=dummy

spring.data.redis.host=localhost
spring.data.redis.port=0
spring.kafka.bootstrap-servers=localhost:0
